name: Halal AI Stock Screener

on:
  schedule:
    # GitHub kann geplante (Cron-)Läufe zu Stoßzeiten komplett überspringen
    # (dokumentierte Einschränkung, kein Bug). Deshalb läuft der Workflow
    # hier mehrfach in einem Zeitfenster – main.py verschickt dank state.py
    # trotzdem garantiert nur EINE E-Mail pro Fenster und Tag.
    #
    # Fenster "morning"  ~ 06:00–08:00 UTC (≈ 08:00–10:00 Uhr Sommerzeit DE)
    - cron: "0 6 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "20 7 * * 1-5"
    - cron: "40 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    # Fenster "evening" ~ 15:30–17:30 UTC (≈ 17:30–19:30 Uhr Sommerzeit DE)
    - cron: "30 15 * * 1-5"
    - cron: "50 15 * * 1-5"
    - cron: "10 16 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "50 16 * * 1-5"
    - cron: "10 17 * * 1-5"
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      run_type:
        description: "morning oder evening (nur für manuellen Start relevant)"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write   # nötig, damit der Workflow den Sende-Status (state/last_sent.json) zurück ins Repo schreiben darf

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Run-Typ bestimmen (morgens/abends anhand der UTC-Uhrzeit)
        id: determine_run_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch"
