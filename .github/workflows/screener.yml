name: Halal AI Stock Screener

on:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "40 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "20 7 * * 1-5"
    - cron: "40 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "30 15 * * 1-5"
    - cron: "50 15 * * 1-5"
    - cron: "10 16 * * 1-5"
    - cron: "30 16 * * 1-5"
    - cron: "50 16 * * 1-5"
    - cron: "10 17 * * 1-5"
    - cron: "30 17 * * 1-5"
  workflow_dispatch:
    inputs:
      run_type:
        description: "morning oder evening"
        required: false
        default: "morning"
        type: choice
        options:
          - morning
          - evening

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Run-Typ bestimmen
        id: determine_run_type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.run_type }}" ]; then
            echo "run_type=${{ inputs.run_type }}" >> "$GITHUB_OUTPUT"
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" -lt 12 ]; then
              echo "run_type=morning" >> "$GITHUB_OUTPUT"
            else
              echo "run_type=evening" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Screener ausfuehren
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWSAPI_KEY: ${{ secrets.NEWSAPI_KEY }}
        run: python main.py --run-type ${{ steps.determine_run_type.outputs.run_type }}

      - name: Sende-Status zurueckschreiben
        run: |
          if [ -n "$(git status --porcelain state/last_sent.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/last_sent.json
            git commit -m "Update Sende-Status [skip ci]"
            git push
          else
            echo "Kein neuer Sende-Status zum Committen (E-Mail wurde uebersprungen oder Fehler trat auf)."
          fi
